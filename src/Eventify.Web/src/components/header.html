
<header
  class="sticky top-0 z-50 backdrop-blur-xl bg-background/85 border-b border-border px-6 py-3.5 transition-all">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-6">

    <!-- ============================================================
         LADO ESQUERDO: Logo & Seletor de Cidade (comum aos dois)
         ============================================================ -->
    <div class="flex items-center gap-6">
      <a href="/" class="flex items-center gap-2.5 group">
        <div
          class="w-9 h-9 rounded-full bg-muted border border-[#8B5CF6]/50 p-1 flex items-center justify-center shadow-[0_0_15px_rgba(139,92,246,0.25)] group-hover:border-[#D946EF] transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M4 12V6L10 14L14 8L20 16" stroke="url(#pulse-gradient)" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round" />
            <defs>
              <linearGradient id="pulse-gradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#8B5CF6" />
                <stop offset="50%" stop-color="#D946EF" />
                <stop offset="100%" stop-color="#06B6D4" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="font-eventifyFontTitle text-xl tracking-wider text-foreground">
          EVENTIFY
        </span>
      </a>

      <button
        class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-muted border border-border hover:bg-accent text-xs font-medium text-muted-foreground hover:text-foreground transition-colors">
        <svg class="w-3.5 h-3.5 text-[#06B6D4]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="font-eventifyFontText2">{{ city }}</span>
        <svg class="w-3 h-3 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>

    <!-- ============================================================
         NAVEGAÇÃO CENTRAL — varia conforme login
         ============================================================ -->
    <nav class="hidden md:flex items-center gap-10 text-sm font-medium">

      <!-- ============ VISITANTE ============ -->
      @if (!user) {
        <a href="/eventos" class="font-eventifyFontText2 text-violet-700 dark:text-eventifyColor2 hover:text-foreground transition">Explorar Eventos</a>
        <a href="/artistas" class="font-eventifyFontText2 text-violet-700 dark:text-eventifyColor2 hover:text-foreground transition">Artistas</a>
        <a href="/forum" class="font-eventifyFontText2 text-violet-700 dark:text-eventifyColor2 hover:text-foreground transition">Fórum</a>
      }

      <!-- ============ LOGADO ============ -->
      @if (user) {
        <a href="/explorar"
          class="font-eventifyFontText2 px-4 py-2 rounded-full bg-eventifyColor2 text-white shadow-[0_0_12px_rgba(139,92,246,0.4)] hover:bg-[#7c3aed] transition">
          Explorar
        </a>
        <a href="/evento" class="font-eventifyFontText2 px-3.5 py-2 rounded-full text-violet-700/70 dark:text-eventifyColor2/70 hover:text-violet-700 dark:hover:text-eventifyColor2 hover:bg-accent transition">
          Detalhes do Evento
        </a>
        <a href="/meus-ingressos"
          class="font-eventifyFontText2 px-3.5 py-2 rounded-full text-violet-700/70 dark:text-eventifyColor2/70 hover:text-violet-700 dark:hover:text-eventifyColor2 hover:bg-accent transition flex items-center gap-1.5">
          Meus Ingressos
          <span
            class="font-eventifyFontText2 px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-eventifyColor3/20 text-eventifyColor3 border border-eventifyColor3/30">
            {{ user.ticketsCount }}
          </span>
        </a>
        <a href="/artistas-salvos"
          class="font-eventifyFontText2 px-3.5 py-2 rounded-full text-muted-foreground hover:text-foreground hover:bg-accent transition">
          <span class="text-violet-700 dark:text-eventifyColor2">Artistas Salvos</span>
        </a>
      }
    </nav>

    <!-- ============================================================
         LADO DIREITO — varia conforme login
         ============================================================ -->
    <div class="flex items-center gap-3">

      <!-- Alternar tema claro/escuro -->
      <button type="button" (click)="toggleTheme()" [attr.aria-label]="isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
        class="p-2 text-muted-foreground hover:text-foreground hover:bg-accent rounded-full transition">
        @if (isDark()) {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" stroke-width="2" />
            <path stroke-linecap="round" stroke-width="2"
              d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41" />
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>
        }
      </button>

      <!-- ============ VISITANTE ============ -->
      @if (!user) {
        <a href="/login" class="font-eventifyFontText2 px-4 py-2 text-xs font-semibold text-muted-foreground hover:text-foreground transition">
          Entrar
        </a>
        <a href="/cadastro"
          class="font-eventifyFontText2 px-4 py-2 rounded-full text-xs font-bold text-white bg-gradient-to-r from-[#8B5CF6] to-[#D946EF] hover:opacity-95 shadow-[0_0_15px_rgba(217,70,239,0.35)] transition">
          Criar Conta
        </a>
      }

      <!-- ============ LOGADO ============ -->
      @if (user) {
        <!-- Campo de Busca -->
        <div class="relative hidden xl:block w-64">
          <svg class="w-4 h-4 text-muted-foreground absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" placeholder="Buscar festivais, DJs, clubes..."
            class="w-full pl-9 pr-8 py-1.5 text-xs bg-muted border border-border rounded-full text-foreground placeholder-muted-foreground focus:outline-none focus:border-[#8B5CF6] focus:ring-1 focus:ring-[#8B5CF6] transition" />
          <span
            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] bg-muted text-muted-foreground px-1.5 py-0.5 rounded border border-border font-mono">
            ⌘K
          </span>
        </div>

        <!-- Notificações -->
        <button class="relative p-2 text-muted-foreground hover:text-foreground hover:bg-accent rounded-full transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-[#D946EF] rounded-full ring-2 ring-background"></span>
        </button>

        <!-- Perfil -->
        <div class="flex items-center gap-3 pl-2 border-l border-border">
          <div class="relative">
            <img [src]="user.avatarUrl" [alt]="user.name"
              class="w-8 h-8 rounded-full object-cover border border-[#8B5CF6]" />
            <span
              class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-400 border-2 border-background rounded-full"></span>
          </div>
          <div class="hidden sm:flex flex-col text-left">
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-semibold text-foreground">{{ user.name }}</span>
              @if (user.isVip) {
                <span
                  class="px-1.5 py-0.2 rounded text-[9px] font-bold bg-[#D946EF]/20 text-[#D946EF] border border-[#D946EF]/40 uppercase tracking-wider">
                  VIP FAN
                </span>
              }
            </div>
            <span class="text-[10px] text-muted-foreground">{{ user.email }}</span>
          </div>
          <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      }
    </div>

  </div>
</header>
